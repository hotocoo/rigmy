# RigMY: API + web. The database persists in the ./data volume.
# Build locally:
#   docker compose up --build
# Or pull release images from GHCR (set the RIGMY_IMAGE_* env vars and remove
# the build sections) — see docs/DEPLOYMENT.md.
services:
  api:
    build:
      context: .
    image: rigmy-api:local
    environment:
      RIGMY_DB: /data/rigmy.db
      RIGMY_CONFIG: /app/config
    volumes:
      - ./data:/data
      # Mount your own config to add retailers/sources without rebuilding:
      # - ./config:/app/config
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "rigmy-api", "--db", "/data/rigmy.db", "seed"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./web
      args:
        RIGMY_API_URL: http://api:8787
    image: rigmy-web:local
    depends_on:
      - api
    ports:
      - "3000:3000"

[workspace]
resolver = "2"
members = ["crates/rigmy-core", "crates/rigmy-wasm", "crates/rigmy-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

# Size-optimised profile used by scripts/build-wasm.sh.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

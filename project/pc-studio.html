  tween(1600, t => { key.intensity = LIGHT.key * t; fill.intensity = LIGHT.fill * t; scene.environmentIntensity = LIGHT.env * t; }, { delay: 150, e: E.out });
  tween(1400, t => { spot.intensity = LIGHT.spot * t; }, { delay: 450, e: E.out });
  tween(2600, t => { intro.k = t; }, { e: E.inOut });
  tween(2400, t => { dustMat.uniforms.uK.value = DUSTK * t; coneMat.uniforms.uK.value = t; backdrop.material.uniforms.uK.value = t; }, { delay: 300, e: E.out });
  tween(1600, t => { gridMat.uniforms.uK.value = t; }, { delay: 1200, e: E.out });
  setTimeout(() => { gridMat.uniforms.uPulse.value = T; }, 1300);
  tween(900, t => { rimMat.emissiveIntensity = 2.2 * t; halo.material.opacity = 0.18 * t; }, { delay: 1500, e: E.out });
  ORDER.forEach((id, i) => { const p = parts[id]; if (!p) return; p.glowK = 0; p.glowT = 0; setTimeout(() => { p.eT = explodeG; p.fadeT = 1; }, (id === 'case' ? 0 : 420) + i * 85); setTimeout(() => { p.glowT = 1; }, 1700 + i * 110); });
  tween(1200, t => { inner.intensity = LIGHT.inner * t; if (areaTop) { areaTop.intensity = (MODE === 'solo' ? 0 : LIGHT.top) * t; areaFront.intensity = (MODE === 'solo' ? 0 : LIGHT.front) * t; } }, { delay: 1800 });

  setTimeout(() => post({ rig: 'revealed' }), 2700);
}

// ---------- camera ----------
const DIRS = { cables: [1, 0.12, 0.35, 1.35, 0.5], gpu: [1, 0.22, 0.32, 2.4, 0.5], cpu: [1, 0.3, 0.45, 5, 0.3], cooler: [1, 0.14, 0.42, 1.25, 0.5], ram: [1, 0.2, 0.6, 3.2, 0.32], mobo: [1, 0.2, 0.3, 1.6, 0.62], ssd: [1, 0.3, 0.4, 4, 0.3], psu: [1, 0.2, 0.6, 2.6, 0.48], case: [1, 0.42, 1.05, 1.0, 1.3] };
const VIEWS = { hero: [1, 0.42, 1.05], side: [1, 0.06, 0.02], top: [0.35, 1.2, 0.3], front: [0.25, 0.15, 1] };
let camTween = null;
const sph0 = new THREE.Spherical(), sph1 = new THREE.Spherical();
function flyTo(target, pos, dur = 1100) {
  const id = {}; camTween = id; lastInteract = T + dur / 1000;

  sph0.setFromVector3(off0); sph1.setFromVector3(off1);

}
controls.addEventListener('start', () => { camTween = null; lastInteract = T + 1e6; controls.autoRotate = MODE === 'solo' && controls.autoRotate; });
controls.addEventListener('end', () => { lastInteract = T; });
const aspectK = () => (innerWidth / Math.max(1, innerHeight) < 1 ? 1.45 : 1);
function homeTarget() { return new V3(0, L ? L.h * 0.47 + 0.018 : 0.25, 0); }
function viewPose(name) {
  const d = VIEWS[name] || VIEWS.hero, s = L ? L.h / 0.49 : 1;
  const t = homeTarget(); const dir = new V3(d[0], d[1], d[2]).normalize();
  return [t, t.clone().addScaledVector(dir, 1.18 * s * aspectK() * (1 + 0.38 * explodeG))];
}
function partCenter(cat) {
  const box = new THREE.Box3();
  for (const p of Object.values(parts)) if (CAT[p.id] === cat && !p.leaving) { const save = p.group.position.clone(); p.group.position.copy(p.base).addScaledVector(p.offset, p.eT); p.group.updateMatrixWorld(true); box.expandByObject(p.group); p.group.position.copy(save); p.group.updateMatrixWorld(true); }

}
function focus(cat, dur = 1100) {
  if (MODE !== 'studio' || !L) return;
  if (!cat || cat === 'case') { const [t, p] = viewPose('hero'); return flyTo(t, p, dur); }
  const box = partCenter(cat); if (box.isEmpty()) return;
  const c = box.getCenter(new V3()), r = box.getBoundingSphere(new THREE.Sphere()).radius;
  const d = DIRS[cat]; const dir = new V3(d[0], d[1], d[2]).normalize();

}
function studioIntro() {
  const [t, p] = viewPose('hero');
  const far = t.clone().add(p.clone().sub(t).applyAxisAngle(new V3(0, 1, 0), 0.9).multiplyScalar(1.9)); far.y = t.y + 0.05;
  camera.position.copy(far); controls.target.copy(t);

}
controls.minDistance = 0.22; controls.maxDistance = 3.2; controls.maxPolarAngle = Math.PI * 0.53;
if (MODE === 'hero') { controls.enabled = false; controls.enableZoom = false; }
const heroCam = { az: 0.62, el: 0.3, dist: 1.3, t: new V3(0, 0.25, 0) };

// ---------- solo (product viewer) ----------
function buildSolo(cat, item) {
  for (const id of Object.keys(parts)) removePart(id);
  const ids = cat === 'case' ? ['case', 'fans', 'glass'] : [cat];
  const fakeCase = { vis: { w: 0.235, h: 0.49, d: 0.46, style: 'mesh', color: 'black' } };
  const lay = computeLayout({ case: cat === 'case' ? { vis: item.vis } : fakeCase, mobo: cat === 'mobo' ? item : null });
  if (cat === 'cooler' && item.vis.type !== 'air') { lay.socket = new V3(0, 0, 0); lay.rad = new V3(-0.02, 0.24, -0.08); lay.radLen = 0.394; }
  if (cat === 'ram') lay.sz = -0.075;

  for (const id of ids) { const p = new Part(id); BUILD[id](p, (cat === 'case' ? item.vis : item.vis) || {}, lay); p.finalize(); p.fade = 0; p.fadeT = 1; parts[id] = p; group.add(p.group); }
  root.add(group);
  if (cat === 'gpu' || cat === 'ssd' || cat === 'cpu' || cat === 'mobo' || cat === 'ram') group.rotation.y = -Math.PI / 2 + 0.0001;
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group); const c = box.getCenter(new V3());
  group.position.set(-c.x, -box.min.y + 0.004, -c.z);
  group.updateMatrixWorld(true);
  box.setFromObject(group); const sp = box.getBoundingSphere(new THREE.Sphere());
  sizePlinth(Math.max(sp.radius * 1.15, 0.12)); root.position.y = 0.018;
  const dist = sp.radius / Math.tan(camera.fov * Math.PI / 360) * 1.25 * aspectK();
  const t = sp.center.clone().add(new V3(0, 0.018, 0));
  const dir = new V3(0.35, 0.32, 1).normalize();
  controls.target.copy(t); camera.position.copy(t).addScaledVector(dir, dist * 1.6).applyAxisAngle(new V3(0, 1, 0), 0);
  flyTo(t, t.clone().addScaledVector(dir, dist), 2000);
  controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
  controls.minDistance = dist * 0.4; controls.maxDistance = dist * 2.2;
  inner.position.copy(t).add(new V3(0.2, 0.1, 0.25)); inner.distance = 1.4;
  spot.target.position.copy(t);
  if (!built) { built = true; for (const id of ids) parts[id].fade = 0; reveal(); }
}

// ---------- interaction ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const ok = h => { const pp = parts[h.object.userData.part]; return !!pp && pp.fade > 0.3; };
  const hits = ray.intersectObjects(root.children, true).filter(h => ok(h) && !h.object.material.userData.isGlass && !(h.object.material.transparent && h.object.material.userData.t0));
  if (hits.length) return CAT[hits[0].object.userData.part];
  const g = ray.intersectObjects(root.children, true).find(ok);
  return g ? CAT[g.object.userData.part] : null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || MODE === 'hero') return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null; if (moved > 5) return;
  const c = pick(e);
  if (MODE === 'studio') { select(c === selected ? null : c, null, true); post({ rig: 'pick', part: c === selected ? c : (c || null) }); }
});
let lastMove = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if (MODE !== 'studio' || e.buttons) { tip.style.opacity = 0; return; }
  const now = performance.now(); if (now - lastMove < 40) return; lastMove = now;
  const c = pick(e); hovered = c && c !== selected ? c : null;
  hovB.cat = hovered; hovB.kT = hovered ? 1 : 0;
  renderer.domElement.style.cursor = c ? 'pointer' : 'grab';
  if (hovered && cur[hovered]) { tip.textContent = LABEL[hovered] + ' · ' + cur[hovered].label; tip.style.opacity = 1; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
  else tip.style.opacity = 0;
});
renderer.domElement.addEventListener('pointerleave', () => { hovB.kT = 0; tip.style.opacity = 0; });
addEventListener('keydown', e => { if (e.key === 'Escape' && selected) { select(null, null, true); post({ rig: 'pick', part: null }); } });

function select(cat, note, fromClick) {
  selected = cat || null; selNote = note || null;
  selB.cat = selected; selB.k = selected ? Math.min(selB.k, 0.2) : selB.k; selB.kT = selected ? 1 : 0;
  hovB.kT = 0;
  renderCallout();
  if (MODE === 'studio') focus(selected);
}
function setIssues(list) {
  issues = list || [];
  issueB.forEach((b, i) => { b.cat = issues[i] || null; b.kT = issues[i] ? 1 : 0; b.pulse = true; });
  renderCallout();
}
function setExplode(v, stagger) {
  explodeG = v;
  const ids = ORDER.filter(id => parts[id] && !parts[id].leaving);
  ids.forEach((id, i) => { const p = parts[id]; if (stagger) setTimeout(() => { if (!p.leaving) p.eT = explodeG; }, (v > 0 ? i : ids.length - i) * 70); else p.eT = v; });
  if (MODE === 'studio' && stagger) setTimeout(() => focus(selected, 1200), 80);
}

addEventListener('message', e => {
  const m = e.data; if (!m || typeof m !== 'object' || !('rig' in m)) return;
  switch (m.rig) {
    case 'build': applyBuild(m.build); break;
    case 'solo': buildSolo(m.cat, m.item); break;
    case 'select': select(m.part, m.note); break;
    case 'explode': setExplode(m.v, m.stagger); break;
    case 'issues': setIssues(m.parts); break;
    case 'view': if (MODE === 'studio') { selected = null; selB.kT = 0; renderCallout(); const [t, p] = viewPose(m.name); flyTo(t, p, 1100); } break;
    case 'cables': Object.assign(CABLE_OPTS, m.opts || {}); cableSig = ''; busy = busy.then(() => rebuildCables()); break;
    case 'cable': hlCable = m.id || null; break;
    case 'xray': xray = !!m.v; break;
    case 'stage': stageShow = m.show ? new Set(m.show) : null; break;
    case 'scroll': heroP = m.p; break;
    case 'pointer': ptr.x = m.x; ptr.y = m.y; break;
    case 'frame': shiftX = m.shiftX || 0; break;
    case 'mood': moodT.set(m.color || 0x3d8bff); break;
    case 'pulse': pulseAt(m.part || null, 0); break;
  }
});

// ---------- frame loop ----------
let vw = 0, vh = 0, vs = null;
stage.onFrame(dt => {
  T += dt;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; if (tw.t < 0) continue; const k = clamp(tw.t / tw.dur); tw.fn(tw.e(k)); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
  const K = 140, C = 2 * Math.sqrt(K) * 0.82;
  for (const p of Object.values(parts)) {
    const hid = stageShow && !stageShow.has(p.id);
    const eTg = hid ? 1.6 : p.eT;
    const fT = hid ? 0 : (xray && (p.id === 'glass' || p.id === 'fans')) ? 0.06 : (p.id === 'cables' && explodeG > 0.3) ? 0 : p.fadeT;
    const a = K * (eTg - p.e) - C * p.v; p.v += a * dt; p.e += p.v * dt;
    p.fade += (fT - p.fade) * Math.min(1, dt * 7);
    p.group.visible = p.fade > 0.015;
    p.glowK += (p.glowT - p.glowK) * Math.min(1, dt * 4);
    const dimT = selected && CAT[p.id] !== selected && MODE !== 'solo' ? 1 : 0; p.dim += (dimT - p.dim) * Math.min(1, dt * 6);
    p.group.position.copy(p.base).addScaledVector(p.offset, p.e);
    p.apply();
    if (p.cableMats) for (const id in p.cableMats) { const m = p.cableMats[id], on = hlCable === id; m.emissive.setHex(0x3d8bff); m.emissiveIntensity = on ? 0.35 + 0.2 * Math.sin(T * 4) : 0; if (hlCable && !on) m.color.multiplyScalar(0.4); }
    for (const r of p.rotors) r.rotor.rotation.z -= r.speed * dt * (0.25 + 0.75 * p.glowK);
  }
  { const warm = issues.length && MODE !== 'hero'; moodC.lerp(moodT, Math.min(1, dt * 1.6)); const tint = warm ? WARM : moodC;
    backdrop.material.uniforms.uTint.value.lerp(tint, Math.min(1, dt * 2)); backdrop.material.uniforms.uTime.value = T; backdrop.position.copy(camera.position);
    gridMat.uniforms.uTime.value = T; gridMat.uniforms.uColor.value.lerp(tint, Math.min(1, dt * 2));
    dustMat.uniforms.uTime.value = T; dustMat.uniforms.uColor.value.copy(moodC).lerp(WHITE, 0.62);
    coneMat.uniforms.uTime.value = T; coneMat.uniforms.uColor.value.set(0xfff1e2).lerp(moodC, 0.18);
    rimLight.color.copy(moodC).lerp(WHITE, 0.3);
    const dir = tmpS.copy(spot.target.position).sub(spot.position).normalize();
    cone.position.copy(spot.position); cone.quaternion.setFromUnitVectors(new V3(0, -1, 0), dir);
    dustMat.uniforms.uSpot.value.copy(spot.position); dustMat.uniforms.uDir.value.copy(dir);
    dustMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360)) * 0.0016;
    if (MODE === 'studio') { const idle = !selected && T - lastInteract > 9; controls.autoRotate = idle; controls.autoRotateSpeed += ((idle ? 0.35 : 0) - controls.autoRotateSpeed) * Math.min(1, dt); }
  }
  updateBracket(selB, dt); updateBracket(hovB, dt); issueB.forEach(b => updateBracket(b, dt));
  // contextual interior light: follows focus, warms on issues
  if (L) {
    const want = selected ? selB.box.getCenter(tmpV) : new V3(0.02, L.h * 0.62, 0);
    if (selected && !selB.box.isEmpty()) inner.position.lerp(want.clone().add(new V3(0.06, 0.02, 0)), Math.min(1, dt * 3));
    else if (MODE !== 'solo') inner.position.lerp(want, Math.min(1, dt * 3));
    const warm = issues.length ? 1 : 0;

  }
  if (MODE === 'hero' && L) {

    const s = L.h / 0.49;

    let tgt = homeTarget();
    if (selected && !selB.box.isEmpty()) { const c = selB.box.getCenter(new V3()); tgt.lerp(c, 0.45); dist *= 0.82; }
    const f = Math.min(1, dt * 2.6);
    heroCam.az += (az - heroCam.az) * f; heroCam.el += (el - heroCam.el) * f; heroCam.dist += (dist - heroCam.dist) * f; heroCam.t.lerp(tgt, f);
    camera.position.set(Math.sin(heroCam.az) * Math.cos(heroCam.el), Math.sin(heroCam.el), Math.cos(heroCam.az) * Math.cos(heroCam.el)).multiplyScalar(heroCam.dist).add(heroCam.t);
    controls.target.copy(heroCam.t);
  }
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  if (w !== vw || h !== vh || shiftX !== vs) { vw = w; vh = h; vs = shiftX; if (shiftX) camera.setViewOffset(w, h, -w * shiftX, 0, w, h); else camera.clearViewOffset(); }

});

if (PP) {
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new PP.EffectComposer(renderer, rt);
  composer.addPass(new PP.RenderPass(scene, camera));
  composer.addPass(new PP.ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); if (c.r != c.r || c.g != c.g || c.b != c.b) c.rgb = vec3(0.0); c.rgb = clamp(c.rgb, 0.0, 5.0); gl_FragColor = c; }' }));

  composer.addPass(new PP.OutputPass());

    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); } void main(){ vec2 dc = vUv - 0.5; vec2 off = dc * dot(dc, dc) * 0.014; vec4 c = texture2D(tDiffuse, vUv); c.r = texture2D(tDiffuse, vUv + off).r; c.b = texture2D(tDiffuse, vUv - off).b; float v = smoothstep(0.86, 0.22, length(vUv - 0.5)); c.rgb *= mix(0.66, 1.0, v); c.rgb += (h(vUv * uRes + fract(uTime) * 91.0) - 0.5) * 0.016; gl_FragColor = c; }',
  });

}
window.__rig = { backdrop, dust, cone, grid, scanner, scene, renderer, spot, key, fill, rimLight, rim2, inner, areaTop, areaFront, parts, rimMat };
post({ rig: 'ready', mode: MODE });
if (MODE === 'solo') {
  const fallbackSolo = setTimeout(() => { if (!built) buildSolo(qs.get('part') || 'gpu', DEFAULT[qs.get('part') || 'gpu']); }, EMBED ? 1400 : 50);
} else {
  setTimeout(() => { if (!built) applyBuild(DEFAULT); }, EMBED ? 1400 : 50);
}

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RigMY store map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body,#map{margin:0;height:100%;background:#0b0d12}
body{font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.leaflet-container{background:#0b0d12;font-family:Archivo,system-ui,sans-serif}
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(0.82) contrast(0.92) saturate(0.35)}
.leaflet-control-attribution{background:rgba(9,11,15,.8)!important;color:#7d8797!important;font:400 10px/1.4 "JetBrains Mono",monospace}
.leaflet-control-attribution a{color:#9fc2ff!important}
.leaflet-control-zoom a{background:rgba(9,11,15,.9)!important;color:#edf0f5!important;border-color:rgba(255,255,255,.12)!important;border-radius:2px!important}
.leaflet-bar{border:1px solid rgba(255,255,255,.12)!important;border-radius:2px!important;box-shadow:none!important}
.pin{position:relative;width:14px;height:14px}
.pin i{position:absolute;inset:0;border-radius:50%;background:var(--c);border:2px solid #0b0d12;box-shadow:0 0 0 1px var(--c),0 0 14px var(--c);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.pin.sel i{transform:scale(1.5)}
.pin.sel::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--c);animation:ring 1.8s cubic-bezier(.16,1,.3,1) infinite}
.pin b{position:absolute;left:20px;top:-4px;white-space:nowrap;padding:4px 7px;background:rgba(9,11,15,.92);border:1px solid rgba(255,255,255,.12);border-radius:2px;color:#edf0f5;font:600 11px/1.1 Archivo,sans-serif;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s}
.pin b em{display:block;margin-top:3px;font:400 10px/1 "JetBrains Mono",monospace;font-style:normal;color:#9aa3b2}
.pin.sel b,.pin:hover b{opacity:1;transform:none}
.me{position:relative;width:18px;height:18px}
.me i{position:absolute;inset:3px;border-radius:50%;background:#edf0f5;box-shadow:0 0 0 3px #3d8bff,0 0 18px #3d8bff}
.me::before,.me::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid #3d8bff;animation:ring 2.4s cubic-bezier(.16,1,.3,1) infinite}
.me::after{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.km{padding:3px 7px;background:#3d8bff;color:#03060c;border-radius:2px;font:600 11px/1 "JetBrains Mono",monospace;white-space:nowrap;transform:translate(-50%,-50%)}
.leaflet-div-icon{background:none;border:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:500;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(7,8,11,.75) 100%)}
#scan{position:fixed;left:0;right:0;height:120px;top:-120px;pointer-events:none;z-index:501;background:linear-gradient(180deg,transparent,rgba(61,139,255,.07) 70%,rgba(61,139,255,.35) 100%);border-bottom:1px solid rgba(61,139,255,.6)}
</style>
</head>
<body>
<div id="map"></div>
<div id="fx"></div>
<div id="scan"></div>
<script>
const EMBED = window.parent !== window;
const map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: 0.25, preferCanvas: false }).setView([4.2, 108.5], 5.5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
const TONE = { ok: '#4fd18b', warn: '#f2b14c', error: '#ff6b6b', info: '#7fb4ff', none: '#9aa3b2' };
let pins = {}, me = null, accC = null, line = null, kmTag = null, data = { branches: [], user: null, sel: null }, fitted = '';
function scan() { const s = document.getElementById('scan'); s.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(' + (innerHeight + 240) + 'px)' }], { duration: 1300, easing: 'cubic-bezier(.45,0,.2,1)' }); }
function icon(b, sel) { return L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7], html: '<div class="pin' + (sel ? ' sel' : '') + '" style="--c:' + (TONE[b.tone] || TONE.none) + '"><i></i><b>' + b.name + (b.sub ? '<em>' + b.sub + '</em>' : '') + '</b></div>' }); }
function render(d) {
  const prevSel = data.sel; data = Object.assign(data, d);
  const ids = new Set(data.branches.map(b => b.id));
  for (const id in pins) if (!ids.has(id)) { map.removeLayer(pins[id]); delete pins[id]; }
  data.branches.forEach(b => {
    if (!pins[b.id]) { pins[b.id] = L.marker([b.lat, b.lon], { icon: icon(b, b.id === data.sel), riseOnHover: true }).addTo(map); pins[b.id].on('click', () => { if (EMBED) parent.postMessage({ map: 'pick', id: b.id }, '*'); }); }
    else pins[b.id].setIcon(icon(b, b.id === data.sel));
    if (b.id === data.sel) pins[b.id].setZIndexOffset(1000); else pins[b.id].setZIndexOffset(0);
  });
  if (data.user) {
    const ll = [data.user.lat, data.user.lon];
    if (!me) { me = L.marker(ll, { icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="me"><i></i></div>' }), interactive: false, zIndexOffset: 2000 }).addTo(map); accC = L.circle(ll, { radius: data.user.acc || 50, color: '#3d8bff', weight: 1, opacity: 0.5, fillColor: '#3d8bff', fillOpacity: 0.08, interactive: false }).addTo(map); }
    else { me.setLatLng(ll); accC.setLatLng(ll); accC.setRadius(Math.min(data.user.acc || 50, 5000)); }
  }
  if (line) { map.removeLayer(line); line = null; } if (kmTag) { map.removeLayer(kmTag); kmTag = null; }
  const sb = data.branches.find(b => b.id === data.sel);
  if (sb && data.user) {
    line = L.polyline([[data.user.lat, data.user.lon], [sb.lat, sb.lon]], { color: '#3d8bff', weight: 2, opacity: 0.9, dashArray: '2 7', lineCap: 'round', interactive: false }).addTo(map);
    if (sb.km) kmTag = L.marker([(data.user.lat + sb.lat) / 2, (data.user.lon + sb.lon) / 2], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="km">' + sb.km + '</div>' }), interactive: false }).addTo(map);
  }
  if (sb && sb.id !== prevSel) {
    const pts = [[sb.lat, sb.lon]]; if (data.user && sb.near) pts.push([data.user.lat, data.user.lon]);
    if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts).pad(0.45), { duration: 1.1, maxZoom: 15 }); else map.flyTo([sb.lat, sb.lon], 14, { duration: 1.1 });
  } else if (!sb) {
    const key = (data.user ? data.user.lat.toFixed(3) + data.user.lon.toFixed(3) : 'x') + '|' + data.branches.length + '|' + (data.focus || '');
    if (key !== fitted) {
      fitted = key;
      let pts = data.branches.map(b => [b.lat, b.lon]);
      if (data.user && data.focus === 'near') { const near = data.branches.slice().sort((a, b) => (a.d || 0) - (b.d || 0)).slice(0, 4).map(b => [b.lat, b.lon]); pts = near.concat([[data.user.lat, data.user.lon]]); }
      if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.25), { duration: 1.4, maxZoom: 13 });
      scan();
    }
  }
}
addEventListener('message', e => { const m = e.data; if (!m || typeof m !== 'object' || m.map !== 'data') return; render(m); });
addEventListener('resize', () => map.invalidateSize());
if (EMBED) parent.postMessage({ map: 'ready' }, '*');
else render({ branches: [{ id: 'a', name: 'Plaza Low Yat', lat: 3.1442, lon: 101.7104, tone: 'ok', sub: '4 on shelf' }, { id: 'b', name: 'SS2 Flagship', lat: 3.1187, lon: 101.6205, tone: 'warn', sub: '1 left' }], user: { lat: 3.107, lon: 101.607, acc: 40 }, focus: 'near' });
</script>
</body>
</html>

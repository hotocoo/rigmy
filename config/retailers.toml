# RigMY retailers.
#
# Ships with NO retailers. Add the shops you want to compare, then list their product pages in
# sources.toml and run `rigmy-api ingest`. Every field shown to users comes from here; RigMY never
# invents retailer data. Only add shops whose details (website, delivery terms) you have verified.
#
# Schema (one [[retailer]] block per shop):
#
#   id          required  short slug, [a-z0-9_-]; referenced by sources.toml / stores.toml
#   name        required  display name
#   city        required  head-office city shown on cards
#   website     required  https URL of the shop
#   pay         optional  free-text payment methods, e.g. "FPX · card · 0% instalment 12 mo"
#   pickup      optional  e.g. "Pickup · <area>" or "Online only"
#   courier     optional  default courier name; must be a [[courier]] name in content.toml
#   enabled     optional  default true; false hides the shop and its offers without deleting history
#   osm_match   optional  case-insensitive substrings matched against OpenStreetMap shop
#                         name/brand/operator when running `ingest --stores-osm`
#   [retailer.import]   optional; enables `rigmy-api import` for this shop. The import fetches
#                       the shop's robots.txt first and refuses to run if the feed path is
#                       disallowed. Rate limits / UA / retries come from sources.toml [settings].
#       kind        "shopify" — paginates the public products.json feed
#       base_url    storefront origin, no trailing slash
#       max_pages   safety cap (Shopify pages hold at most 250 products); default 40
#   [retailer.delivery.<region>]   one table per region the shop delivers to
#                         (regions: kv, pen, jhr, east). A missing region = does not deliver there.
#       fee     number, RM per order; multiplied per category by [delivery] size_multiplier in
#               content.toml for bulky parts (cases x2 as shipped)
#       eta     a label from the [[eta]] table in content.toml: "Same day", "Next day", "1–2 days",
#               "2–3 days", "3–5 days", "5–7 days"
#               (note the en dash – in ranges)
#
# Example (commented out; replace every value with the real shop's details):
#
# [[retailer]]
# id = "example-shop"
# name = "Example PC Store"
# city = "Kuala Lumpur"
# website = "https://www.example-pc-store.my"
# pay = "FPX · card"
# pickup = "Pickup · Kuala Lumpur"
# courier = "Example Courier"
# enabled = true
# osm_match = ["Example PC Store"]
#
# [retailer.delivery.kv]
# fee = 10
# eta = "1–2 days"
#
# [retailer.delivery.pen]
# fee = 15
# eta = "2–3 days"
#
# [retailer.delivery.jhr]
# fee = 15
# eta = "2–3 days"
#
# [retailer.delivery.east]
# fee = 35
# eta = "5–7 days"

# ---------------------------------------------------------------------------
# Verified real retailers (public feeds, crawl permission checked against each
# site's robots.txt before the first import; see docs/DATA-SOURCES.md).
# ---------------------------------------------------------------------------

[[retailer]]
id = "all-it"
name = "ALL IT Hypermarket"
city = "Kuala Lumpur"
website = "https://www.allithypermarket.com.my"

[retailer.import]
kind = "shopify"
base_url = "https://www.allithypermarket.com.my"
max_pages = 60

# EMARQUE — PC-specialist Shopify store; open products.json feed (robots.txt allows
# crawlers). Stocks the catalogue's AMD / NVIDIA parts. Delivery terms not yet confirmed.
[[retailer]]
id = "emarque"
name = "EMARQUE"
city = "Kuala Lumpur"
website = "https://emarque.co"

[retailer.import]
kind = "shopify"
base_url = "https://emarque.co"
max_pages = 40

# DOTATECH — PC / NUC specialist Shopify store; open products.json feed.
[[retailer]]
id = "dotatech"
name = "DOTATECH"
city = "Kuala Lumpur"
website = "https://www.dotatech.com.my"

[retailer.import]
kind = "shopify"
base_url = "https://www.dotatech.com.my"
max_pages = 40

# Sen Heng — general electronics retailer (WooCommerce). The Store API is open in
# robots.txt but a WAF returns 403 to non-browser clients, so its parts are mapped
# per product in sources.toml (jsonld) rather than bulk-imported.
[[retailer]]
id = "senheng"
name = "Sen Heng"
city = "Kuala Lumpur"
website = "https://www.senheng.com.my"

# Courts — general electronics retailer (Magento 2). No open feed; parts mapped per
# product in sources.toml.
[[retailer]]
id = "courts"
name = "Courts"
city = "Kuala Lumpur"
website = "https://www.courts.com.my"

# Aeon — general electronics / hypermarket retailer. robots.txt sets Crawl-delay: 10;
# raise [settings] delay_ms to at least 10000 before mapping its sources.
[[retailer]]
id = "aeon"
name = "Aeon"
city = "Kuala Lumpur"
website = "https://www.aeon.com.my"

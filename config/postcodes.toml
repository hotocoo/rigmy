# Malaysian postcode areas: 2-digit postcode prefix -> town centroid.
#
# Used to place a user who types a postcode instead of sharing their location (the engine's
# `postcode()` and the location picker). Each entry is the approximate centre of the main town of
# the area whose postcodes start with `prefix`, so the position is only roughly right (reported
# with a 3 km accuracy radius). The delivery region is derived from the coordinates.
# Served to the web app as `Bootstrap.postcodes`. This file is required.
#
#   prefix  required  exactly 2 digits, unique
#   town    required  town name shown to the user
#   lat     required  latitude (WGS84)
#   lon     required  longitude (WGS84)
#
# Source: the RigMY prototype's postcode table (town centroids, about 2-3 decimal places).
# Prefixes with no entry are not recognised.


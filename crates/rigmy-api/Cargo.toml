[package]
name = "rigmy-api"
description = "RigMY HTTP API, SQLite store and price ingester."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rigmy-api"
path = "src/main.rs"

[dependencies]
rigmy-core = { path = "../rigmy-core" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
toml.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
